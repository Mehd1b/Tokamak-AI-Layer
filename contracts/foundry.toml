[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Minimal bytecode profile for HyperEVM (3M block gas limit)
[profile.small]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 1
via_ir = true
cbor_metadata = false
bytecode_hash = "none"

# Minimal bytecode without via_ir (avoids Yul stack depth issues)
[profile.compact]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 1
cbor_metadata = false
bytecode_hash = "none"

[rpc_endpoints]
mainnet = "${RPC_URL_MAINNET}"
hyper_mainnet = "${RPC_URL_HYPER_MAINNET}"
optimism = "${RPC_URL_OPTIMISM}"
arbitrum = "${RPC_URL_ARBITRUM}"
polygon = "${RPC_URL_POLYGON}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1, url = "https://api.etherscan.io/api" }
hyperevm_mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 999, url = "https://api.etherscan.io/v2/api?chainid=999" }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = 10, url = "https://api-optimistic.etherscan.io/api" }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161, url = "https://api.arbiscan.io/api" }
polygon = { key = "${ETHERSCAN_API_KEY}", chain = 137, url = "https://api.polygonscan.com/api" }

[profile.test_medium]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
test = "test"
