name: deploy-billing-server

# Deploys tokagent-billing-server to Fly.io on tag `billing-server-v*`.
# Migrations run PRE-DEPLOY against the production Neon database; if the
# migration fails, the deploy aborts and prod stays on the previous revision.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN          — flyctl tokens create deploy
#   NEON_BILLING_URL       — same value as the BILLING_DATABASE_URL Fly secret
#                            (this workflow needs DB access to run migrations)

on:
  push:
    tags:
      - 'billing-server-v*'

concurrency:
  # Only one deploy in flight at a time. Cancel-in-progress = false so we
  # never abort a half-applied bluegreen swap.
  group: deploy-billing-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-billing-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3'

      - name: Install workspace deps
        run: bun install --frozen-lockfile
        working-directory: tokagentos

      - name: Typecheck billing surface
        working-directory: tokagentos
        run: |
          ./packages/billing/node_modules/.bin/tsc --noEmit -p packages/billing/tsconfig.json
          ./plugins/plugin-tokagent-billing/node_modules/.bin/tsc --noEmit -p plugins/plugin-tokagent-billing/tsconfig.json

      - name: Run Drizzle migrations (production Neon, idempotent)
        working-directory: tokagentos/packages/billing
        env:
          DATABASE_URL: ${{ secrets.NEON_BILLING_URL }}
        run: bun run drizzle-kit migrate

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (bluegreen)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config tokagentos/apps/billing-server/fly.toml \
            --dockerfile tokagentos/apps/billing-server/Dockerfile \
            --remote-only \
            --strategy bluegreen \
            --app tokagent-billing-server

      - name: Wait for warm-up
        run: sleep 20

      - name: Post-deploy readiness check
        run: |
          bun tokagentos/scripts/billing-server/check-readiness.ts \
            https://gateway.tokagent.ai \
            --full
