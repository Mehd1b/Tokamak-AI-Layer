version: "3.8"

services:
  oracle-service:
    build: .
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oracle_service
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle -d oracle_service"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
