[package]
name = "prover-service"
version = "0.1.0"
edition = "2021"
description = "Hosted RISC Zero proof generation service for Tokamak AI Layer"
license = "MIT OR Apache-2.0"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unique identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Hashing (for input dedup)
sha2 = "0.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hex encoding
hex = "0.4"

# Async trait
async-trait = "0.1"

# Graceful shutdown
tokio-util = "0.7"

# Error handling
thiserror = "2"
