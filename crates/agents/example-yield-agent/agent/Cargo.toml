[package]
name = "example-yield-agent"
version = "0.1.0"
edition = "2021"
description = "Example yield agent for E2E testing with MockYieldSource integration"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "sim"
path = "src/bin/sim.rs"
required-features = ["simulator"]

[features]
default = []
simulator = ["kernel-sdk/simulator"]

[dependencies]
kernel-sdk = { path = "../../../sdk/kernel-sdk" }
kernel-guest = { path = "../../../runtime/kernel-guest" }
constraints = { path = "../../../protocol/constraints" }

[dev-dependencies]
kernel-sdk = { path = "../../../sdk/kernel-sdk", features = ["testing", "std"] }

[build-dependencies]
sha2 = "0.10"
