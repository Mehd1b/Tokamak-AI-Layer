[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokagent-sdk"
version = "0.1.0"
description = "Python SDK for building Tokamak AI Layer agents"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "eth-abi>=5.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["tokagent*"]
